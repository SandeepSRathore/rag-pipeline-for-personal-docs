[project]
name = "lcrag"
version = "0.1.0"
description = "The same Lumora Labs RAG app, rebuilt with LangChain for comparison."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-qdrant>=0.2",
    "langchain-text-splitters>=0.3",
    "ragkit",
    "sqlalchemy[asyncio]>=2.0",
    "langchain-classic>=1.0",
]

[project.scripts]
lcrag = "lcrag.cli:app"

[tool.uv.sources]
ragkit = { path = "..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["lcrag", "ragkit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "RUF012"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:qdrant_client"]
