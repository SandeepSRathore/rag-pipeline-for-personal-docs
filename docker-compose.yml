services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"   # bind to localhost only, never 0.0.0.0
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/var
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./var:/app/var
      - ./data:/app/data:ro
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
