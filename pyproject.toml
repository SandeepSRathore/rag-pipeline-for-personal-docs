[project]
name = "ragkit"
version = "0.1.0"
description = "Production-style RAG pipeline for learning: incremental ingestion, hybrid retrieval, guardrails, evals."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "filelock>=3.16",
]

[project.scripts]
rag = "ragkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pip-audit>=2.7",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# B008: FastAPI Depends()/File() and typer.Argument() in defaults is the documented pattern.
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "RUF012"]
"scripts/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Qdrant (make up)"]
addopts = "-q"
